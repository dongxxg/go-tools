[App]
Id = "kit_test"
Name = "kit_test"

[Server]
[Server.Http]
Host = "0.0.0.0"
Port = 43032


[Logging]
IsJSON = false
Level = "debug"
MaxSize = 1024
MaxAge = 7
Compress = false
# 保留文件的最大数量
MaxBackups = 30
# 是否在容器内打印日志
KeepInContainer = true

[Server.Debug]
Host = "0.0.0.0"
Port = 43012

[SD]
# 是否注册到nacos, 如果为false, 需要手动改为true
Enabled = true
# 注册到nacos 的地址， 多网卡时需要配置， 单网卡时可为空 手动配置注册到nacos 的地址
Host = ""
Name = "kafka_demo"

[SD.Client]
Enabled = true
Username = "nacos"
Password = "nacos"
HeartBeat = true
TimeoutMs = 300
Group = "DEFAULT_GROUP"

[SD.Server]
# "192.168.6.71"
IpAddr = "127.0.0.1"
Port = 8848


[Mysql]
Driver = "mysql"
Dsn = "root:root@tcp(localhost:3306)/ala?parseTime=true&loc=Local&"
MaxIdleConn = 10
MaxOpenConn = 10


[demo]
name = "abb"
age = 30

[Redis]
Type = "node"
Host = "localhost:6379"
Password = "wiken"
Db = 0

[Topic]
Event = "test"
Notify = "test"

[Event.Kafka] # 接收告警信息
Brokers = "127.0.0.1:9092"
Oldest = false
Group = "demo"
Version = "2.0.0"

# 底坐客户端连接使用的 sha512 sha256 gssapi plain
#KafkaAlgorithm = "sha512"

Assignor = "range" # 负载均衡策略  sticky  roundrobin range
SaslEnable = false
UserName = ""
Password = ""
Algorithm = "" # plain oauthbearer  sha512 sha256 gssapi
# Kerberos时  algrithm 为 gssapi，
# 配置
# Realm, ServiceName, UserName
# KeyTabPath, KerberosConfigPath
CertFile = ""
CaFile = ""
KeyFile = ""
VerifySSL = false
Realm = ""
ServiceName = ""
KeyTabPath = ""
KerberosAuthType = 2 # 1: KRB5_USER_AUTH  2: KRB5_KEYTAB_AUTH
KerberosConfigPath = ""
DisablePAFXFAST = false


[Notify.Kafka] # 接收告警信息
Brokers = "127.0.0.1:9092"
Oldest = false
Group = "demo"
Version = "2.0.0"

# 底坐客户端连接使用的 sha512 sha256 gssapi plain
#KafkaAlgorithm = "sha512"

Assignor = "range" # 负载均衡策略  sticky  roundrobin range
SaslEnable = false
UserName = ""
Password = ""
Algorithm = "" # plain oauthbearer  sha512 sha256 gssapi
# Kerberos时  algrithm 为 gssapi，
# 配置
# Realm, ServiceName, UserName
# KeyTabPath, KerberosConfigPath
CertFile = ""
CaFile = ""
KeyFile = ""
VerifySSL = false
Realm = ""
ServiceName = ""
KeyTabPath = ""
KerberosAuthType = 2 # 1: KRB5_USER_AUTH  2: KRB5_KEYTAB_AUTH
KerberosConfigPath = ""
DisablePAFXFAST = false


[Event.Rocketmq]
Brokers = "127.0.0.1:9876"
Username = ""
Password = ""
Group = "unios-alarm-process-group"
# 流控， 默认1000
ConsumerMaxSpan = 2000


[Notify.Rocketmq]
Brokers = "127.0.0.1:9876"
Username = ""
Password = ""
Group = "unios-alarm-process-group"
# 流控， 默认1000
ConsumerMaxSpan = 2000

[Pub.ES]
Urls = "http://localhost:9200"
# ES 类型 ， 6.几版本时， 需要配置, 7.几时，配置为空
Type = ""
Username = ""
Password = ""
# 生成入ES语句 等待PUB_ES_WAITTIME秒入单位秒， 如WatiTime为5时， 表示每5s， 如果有数据则入es一次
WaitTime = 5
# ${Pub.Es.Index.Prefix}am_ala_alarmsummary_${!now().format_timestamp("20060102", "${Alarm.Es.Zone}")}
Index = "am_ala_alarmsummary"
IndexLayout = "20060102"


[Pub.Es.Index]
# 入es 库的es 索引前缀
Prefix = ""